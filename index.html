  }).join("");
  var ongoing = STATE.tasks.filter(function(k){return !k.due;});
  return gantt + "<div class=\"grid grid-cols-1 lg:grid-cols-[1.5fr_1fr] gap-5 items-start\"><section class=\"" + CARD + "\"><h2 class=\"" + H2 + "\">Week by week</h2>" + agenda + "</section>" +
    "<section class=\"" + CARD + "\"><h2 class=\"" + H2 + "\">Ongoing, no fixed date</h2><ul>" + ongoing.map(function(k){return taskRow(k,true);}).join("") + "</ul></section></div>";
}

function vTodos(){
  var f = ui.f || {};
  var shown = STATE.tasks.filter(function(t){
    return (!f.win || t.win===f.win) && (!f.ws || t.ws===f.ws) && (!f.st || (f.st==="open" ? t.status!=="Done" : t.status===f.st)) &&
      (!f.q || (t.title + " " + t.owner + " " + (t.notes||"")).toLowerCase().indexOf(f.q.toLowerCase()) >= 0);
  });
  var groups = WINDOWS.map(function(w){
    var ts = shown.filter(function(t){return t.win===w.id;}).sort(function(a,b){ return (a.due||"9")<(b.due||"9")?-1:1; });
    if(!ts.length) return "";
    var p = progress(STATE.tasks.filter(function(t){return t.win===w.id;}));
    return "<section class=\"" + CARD + "\"><h2 class=\"" + H2 + "\">" + w.name + "<small class=\"" + SMALL + "\">" + (w.to ? fmt(w.from) + " – " + fmt(w.to) : "From " + fmt(w.from)) + " · " + p.done + "/" + p.total + " done</small></h2><ul>" + ts.map(function(t){return taskRow(t,false);}).join("") + "</ul></section>";
  }).join("");
  function sel(name, o, label){ return "<label class=\"" + LABEL + "\">" + label + "<select data-filter=\"" + name + "\" class=\"" + FIELD + "\"><option value=\"\">All</option>" + opts(o, f[name]) + "</select></label>"; }
  return "<section class=\"" + CARD + " grid grid-cols-2 lg:grid-cols-[1fr_1fr_1fr_1.5fr] gap-3\">" +
    sel("win", WINDOWS.map(function(w){return [w.id,w.name];}), "Window") + sel("ws", WORKSTREAMS, "Workstream") + sel("st", [["open","Not done"]].concat(STATUSES), "Status") +
    "<label class=\"" + LABEL + " col-span-2 lg:col-span-1\">Search<input type=\"search\" data-filter=\"q\" class=\"" + FIELD + " w-full\" value=\"" + esc(f.q || "") + "\" placeholder=\"Title, owner, notes\"></label></section>" +
    "<section class=\"" + CARD + "\"><h2 class=\"" + H2 + "\">Add a to-do</h2><form data-form=\"add\" class=\"grid grid-cols-2 lg:grid-cols-[2.4fr_1.2fr_1fr_1fr_auto] gap-2\">" +
    "<input name=\"title\" class=\"" + FIELD + " col-span-2 lg:col-span-1\" placeholder=\"What needs doing?\" required aria-label=\"To-do\">" +
    "<select name=\"ws\" class=\"" + FIELD + "\" aria-label=\"Workstream\">" + opts(WORKSTREAMS) + "</select>" +
    "<select name=\"win\" class=\"" + FIELD + "\" aria-label=\"Window\">" + opts(WINDOWS.map(function(w){return [w.id,w.name];})) + "</select>" +
    "<input type=\"date\" name=\"due\" class=\"" + FIELD + "\" aria-label=\"Due date\"><button class=\"" + BTN + "\" type=\"submit\">Add to-do</button></form></section>" +
    (groups || "<section class=\"" + CARD + "\"><p class=\"font-light " + MUTED + "\">No to-dos match these filters. Clear a filter to see more.</p></section>");
}

var STAGE_BG = {Awareness:"bg-[#EEF3F9] dark:bg-navy-7", Consideration:"bg-powder dark:bg-navy-7", Evaluation:"bg-beige-1 dark:bg-navy-7", Decision:"bg-beige-2 dark:bg-navy-7"};
var TH = "text-left font-medium text-[12.5px] px-2.5 py-2 border-b border-beige-2 dark:border-navy-7 whitespace-nowrap " + MUTED;
var TD = "px-2.5 py-2.5 border-b border-beige-2 dark:border-navy-7 align-top";
function vQueries(){
  var rows = STATE.queries.map(function(q){
    var pips = MONTHS.map(function(m){ var r = (STATE.results[m]||{})[q.n] || {}; var any = ASSISTANTS.some(function(a){return r[a];}); var y = ASSISTANTS.filter(function(a){return r[a]==="Y";}).length;
      return "<i class=\"block w-3 h-3 rounded-[3px] border " + (y ? "bg-ok border-ok" : any ? "bg-[#FAF8F4] dark:bg-navy border-grey-4" : "border-beige-2 dark:border-navy-7") + "\" title=\"" + MONTH_LABEL[m] + ": " + (any ? y + " of 5 assistants" : "not checked") + "\"></i>"; }).join("");
    return "<tr><td class=\"" + TD + " tabular-nums w-7 " + MUTED + "\">" + q.n + "</td><td class=\"" + TD + " min-w-[320px]\"><div class=\"font-medium mb-0.5\">" + esc(q.q) + "</div><div class=\"flex flex-wrap gap-x-3.5 gap-y-1 text-[12.5px] font-light " + MUTED + "\">" + chip(q.stage, STAGE_BG[q.stage]) + "<span>" + esc(q.build) + "</span></div>" +
      "<input class=\"" + FIELD + " w-full mt-2 text-[12.5px]\" data-act=\"qurl\" data-n=\"" + q.n + "\" value=\"" + esc(q.url || "") + "\" placeholder=\"Page URL once live\" aria-label=\"Page URL for query " + q.n + "\"></td>" +
      "<td class=\"" + TD + " whitespace-nowrap\">" + winOf(q.wave).name + "<div class=\"text-[12.5px] font-light " + MUTED + "\">Due " + fmt(q.due) + "</div></td>" +
      "<td class=\"" + TD + "\"><select data-act=\"qstatus\" data-n=\"" + q.n + "\" aria-label=\"Page status\" class=\"" + FIELD + " font-medium " + statusClass(q.status) + "\">" + opts(PAGE_STATUSES, q.status) + "</select></td>" +
      "<td class=\"" + TD + "\"><div class=\"flex gap-1 pt-1\">" + pips + "</div></td></tr>";
  }).join("");
  return "<section class=\"" + CARD + "\"><h2 class=\"" + H2 + "\">Top 15 queries<small class=\"" + SMALL + "\">One page per query. Squares show each month's AI visibility, oldest first.</small></h2><div class=\"overflow-x-auto\"><table class=\"w-full border-collapse text-[13.5px]\"><thead><tr>" +
    ["#","Query and what we build","Wave","Page status","Named by AI"].map(function(h){return "<th class=\"" + TH + "\">" + h + "</th>";}).join("") + "</tr></thead><tbody>" + rows + "</tbody></table></div></section>";
}

function vVisibility(){
  var m = ui.month || latestMonth() || MONTHS[0], r = STATE.results[m] || {};
  var grid = STATE.queries.map(function(q){ var row = r[q.n] || {};
    return "<tr><td class=\"px-1.5 py-1.5 border-b border-beige-2 dark:border-navy-7 tabular-nums " + MUTED + "\">" + q.n + "</td><td class=\"px-1.5 py-1.5 border-b border-beige-2 dark:border-navy-7 min-w-[240px] text-[13px]\">" + esc(q.q) + "</td>" +
      ASSISTANTS.map(function(a){ var v = row[a] || "";
        var cls = v==="Y" ? "bg-ok border-ok text-white font-medium" : v==="N" ? "bg-[#FAF8F4] dark:bg-navy text-navy dark:text-beige border-beige-2 dark:border-navy-7" : "bg-white dark:bg-ink-2 border-beige-2 dark:border-navy-7 " + MUTED;
        return "<td class=\"px-1.5 py-1.5 border-b border-beige-2 dark:border-navy-7\"><button data-act=\"cell\" data-n=\"" + q.n + "\" data-a=\"" + a + "\" class=\"font-sans text-[12.5px] w-full min-w-[76px] border rounded px-1 py-1.5 cursor-pointer " + cls + "\" aria-label=\"" + esc(a + ", query " + q.n + ": " + (v==="Y" ? "named" : v==="N" ? "not named" : "not checked")) + "\">" + (v==="Y" ? "Named" : v==="N" ? "No" : "—") + "</button></td>"; }).join("") + "</tr>"; }).join("");
  var chart = MONTHS.slice(1).map(function(mm){
    var n = runsFilled(mm) ? namedCount(mm) : null, tg = STATE.targets[mm];
    return "<div class=\"flex flex-col items-center gap-1 h-full text-xs " + MUTED + "\"><div class=\"relative flex-1 w-full max-w-[44px] border-b border-beige-2 dark:border-navy-7\"><i class=\"absolute bottom-0 inset-x-0 border-[1.5px] border-b-0 border-dashed border-steel\" style=\"height:" + (tg/15*100) + "%\" title=\"Target " + tg + "\"></i>" +
      (n != null ? "<i class=\"absolute bottom-0 inset-x-[7px] " + (n >= tg ? "bg-ok" : "bg-navy dark:bg-beige") + "\" style=\"height:" + (n/15*100) + "%\" title=\"Named " + n + "\"></i>" : "") +
      "</div><b class=\"text-[15px] text-navy dark:text-beige tabular-nums\">" + (n==null ? "—" : n) + "<span class=\"font-light text-xs " + MUTED + "\">/" + tg + "</span></b><span>" + MONTH_LABEL[mm].replace(" 20"," ’") + "</span></div>"; }).join("");
  return "<div class=\"grid grid-cols-1 lg:grid-cols-[1.5fr_1fr] gap-5 items-start\"><section class=\"" + CARD + "\"><h2 class=\"" + H2 + "\">Named vs target<small class=\"" + SMALL + "\">Queries where at least one assistant names Neovara</small></h2><div class=\"grid grid-cols-6 gap-2.5 items-end h-[190px]\">" + chart + "</div>" +
    "<p class=\"mt-3 " + SMALL + "\"><span class=\"inline-block w-2.5 h-2.5 mr-1.5 align-[-1px] border-[1.5px] border-dashed border-steel\"></span>Target <span class=\"inline-block w-2.5 h-2.5 ml-3 mr-1.5 align-[-1px] bg-navy dark:bg-beige\"></span>Actual</p></section>" +
    "<section class=\"" + CARD + "\"><h2 class=\"" + H2 + "\">" + MONTH_LABEL[m] + "</h2><div class=\"grid grid-cols-2 gap-3 mb-4\">" + stat(namedCount(m) + "/15", "Queries named", "", true) + stat(runsFilled(m) + "/75", "Checks logged", "", true) + "</div>" +
    "<label class=\"" + LABEL + "\">Month<select data-act=\"month\" class=\"" + FIELD + "\">" + opts(MONTHS.map(function(x){return [x, MONTH_LABEL[x]];}), m) + "</select></label></section></div>" +
    "<section class=\"" + CARD + "\"><h2 class=\"" + H2 + "\">Log this month's checks<small class=\"" + SMALL + "\">Ask each query in each assistant. Click a cell to cycle: not checked, Named, No.</small></h2><div class=\"overflow-x-auto\"><table class=\"w-full border-collapse text-[13.5px]\"><thead><tr><th class=\"" + TH + "\">#</th><th class=\"" + TH + "\">Query</th>" + ASSISTANTS.map(function(a){return "<th class=\"" + TH + "\">" + a + "</th>";}).join("") + "</tr></thead><tbody>" + grid + "</tbody></table></div></section>";
}

function vDecisions(){
  return "<section class=\"" + CARD + "\"><h2 class=\"" + H2 + "\">Decisions needed from Greg<small class=\"" + SMALL + "\">These unblock the roadmap</small></h2><ul>" + STATE.decisions.map(function(x,i){
    var ok = x.status==="Approved";
    return "<li class=\"flex flex-wrap sm:flex-nowrap gap-3.5 items-start py-3.5 border-t border-beige-2 dark:border-navy-7 first:border-t-0\"><span class=\"font-bold text-lg w-[22px]\">" + (i+1) + "</span><div class=\"flex-1 min-w-0\"><div class=\"text-[14.5px] font-medium" + (ok ? " line-through " + MUTED : "") + "\">" + esc(x.title) + "</div><div class=\"text-[13px] mt-1 " + MUTED + "\">" + esc(x.why) + "</div><div class=\"flex flex-wrap gap-x-3.5 text-[12.5px] font-light mt-1 " + MUTED + "\"><span>When: " + esc(x.due) + "</span>" + (ok && x.approvedAt ? "<span>Approved " + new Date(x.approvedAt).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) + "</span>" : "") + "</div></div>" +
      "<button data-act=\"decide\" data-id=\"" + x.id + "\" class=\"" + (ok ? "font-sans text-[13.5px] rounded px-3.5 py-2 border border-beige-2 dark:border-navy-7 bg-transparent cursor-pointer " + MUTED : BTN) + "\">" + (ok ? "Undo approval" : "Mark approved") + "</button></li>";
  }).join("") + "</ul></section>" +
  "<section class=\"" + CARD + "\"><h2 class=\"" + H2 + "\">Risks</h2><ul>" + [
    ["Broad queries stay out of reach","Large firms hold \"best AI company in UAE\". We win the niche first, then widen."],
    ["Results lag publishing","Assistants refresh on their own schedules. We track monthly and keep refreshing pages."],
    ["Baseline delayed","Without HubSpot AEO access, checks are logged by hand on the AI visibility tab."]].map(function(r){
      return "<li class=\"py-2 border-t border-beige-2 dark:border-navy-7 first:border-t-0 text-[13.5px]\"><b class=\"font-medium block\">" + esc(r[0]) + "</b><span class=\"font-light " + MUTED + "\">" + esc(r[1]) + "</span></li>"; }).join("") + "</ul></section>";
}

/* ---------- events ---------- */
function findTask(id){ return STATE.tasks.filter(function(t){return t.id===id;})[0]; }
function copy(o){ return JSON.parse(JSON.stringify(o)); }
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-tab],[data-act]"); if(!el) return;
  if(el.dataset.tab){ ui.tab = el.dataset.tab; ui.editing = null; saveUi(); render(); window.scrollTo(0,0); return; }
  var a = el.dataset.act;
  if(a==="edit"){ ui.editing = ui.editing===el.dataset.id ? null : el.dataset.id; render(); }
  else if(a==="cancel"){ ui.editing = null; render(); }
  else if(a==="delete"){ var t = findTask(el.dataset.id); if(t && confirm("Delete \"" + t.title + "\" for everyone?")){ ui.editing = null; write([], [{kind:"task", id:t.id}], "Deleted: " + t.title); } }
  else if(a==="cell"){ var n = el.dataset.n, asn = el.dataset.a, m = ui.month || latestMonth() || MONTHS[0], id = m + "|" + n + "|" + asn;
    var cur = ((STATE.results[m]||{})[n]||{})[asn] || "", v = cur==="" ? "Y" : cur==="Y" ? "N" : "";
    ui.month = m; saveUi();
    if(v) write([R("result", id, {m:m, n:String(n), a:asn, v:v})], []); else write([], [{kind:"result", id:id}]); }
  else if(a==="decide"){ var x = copy(STATE.decisions.filter(function(y){return y.id===el.dataset.id;})[0]);
    if(x.status==="Approved"){ x.status = "Pending"; x.approvedAt = null; write([R("decision", x.id, x)], [], "Approval undone: " + x.title); }
    else { x.status = "Approved"; x.approvedAt = new Date().toISOString(); write([R("decision", x.id, x)], [], "Approved: " + x.title); } }
  else if(a==="export"){ var blob = new Blob([JSON.stringify(STATE, null, 2)], {type:"application/json"}); var link = document.createElement("a");
    link.href = URL.createObjectURL(blob); link.download = "neovara-ai-visibility-" + new Date().toISOString().slice(0,10) + ".json"; document.body.appendChild(link); link.click(); link.remove(); setTimeout(function(){ URL.revokeObjectURL(link.href); }, 1000); }
  else if(a==="reset"){ if(confirm("Reset everything to the original plan? Changes in this browser will be cleared.")){ rows = {}; try { localStorage.removeItem(KEY + "-rows"); } catch(_){} loadLocal(); render(); } }
  else if(a==="signout"){ sb.auth.signOut(); }
  else if(a==="retry-signin"){ phase = "signin"; render(); }
  else if(a==="reload"){ location.reload(); }
});
document.addEventListener("change", function(e){
  var el = e.target;
  if(el.dataset.filter){ ui.f[el.dataset.filter] = el.value; saveUi(); render(); return; }
  var a = el.dataset.act;
  if(a==="toggle"){ var t = copy(findTask(el.dataset.id)); t.status = el.checked ? "Done" : "To do"; write([R("task", t.id, t)], [], (el.checked ? "Done: " : "Reopened: ") + t.title); }
  else if(a==="status"){ var t2 = copy(findTask(el.dataset.id)); t2.status = el.value; write([R("task", t2.id, t2)], [], t2.title + " → " + el.value); }
  else if(a==="qstatus"){ var q = copy(STATE.queries.filter(function(x){return String(x.n)===el.dataset.n;})[0]); q.status = el.value; write([R("query", String(q.n), q)], [], "Query " + q.n + " page → " + el.value); }
  else if(a==="qurl"){ var q2 = copy(STATE.queries.filter(function(x){return String(x.n)===el.dataset.n;})[0]); q2.url = el.value.trim(); write([R("query", String(q2.n), q2)], []); }
  else if(a==="month"){ ui.month = el.value; saveUi(); render(); }
  else if(a==="import" && el.files && el.files[0]){ var rd = new FileReader();
    rd.onload = function(){ try { var p = JSON.parse(rd.result); if(!p.tasks || !p.queries || !p.decisions) throw 0;
        if(LIVE && !confirm("Import this file? It overwrites matching to-dos, queries, decisions and checks for everyone.")) return;
        var ups = rowsFromState(p).filter(function(r){ return r.kind !== "log"; }).map(function(r){ return R(r.kind, r.id, r.data, r.sort); });
        write(ups, [], "Imported progress file"); }
      catch(_){ alert("That file isn't a tracker export. Choose a .json file saved with Export progress."); } };
    rd.readAsText(el.files[0]); el.value = ""; }
});
document.addEventListener("input", function(e){
  if(e.target.dataset.filter==="q"){ ui.f.q = e.target.value; saveUi(); clearTimeout(window.__qt);
    window.__qt = setTimeout(function(){ var pos = e.target.selectionStart; render(); var s = document.querySelector("[data-filter=q]"); if(s){ s.focus(); try { s.setSelectionRange(pos,pos); } catch(_){} } }, 250); }
});
document.addEventListener("submit", function(e){
  e.preventDefault(); var f = e.target, fd = new FormData(f);
  if(f.dataset.form==="signin"){ var email = String(fd.get("email")).trim(); ui.lastEmail = email; saveUi(); errMsg = "";
    var btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Sending…";
    sb.auth.signInWithOtp({email:email, options:{emailRedirectTo:location.origin + location.pathname, shouldCreateUser:true}}).then(function(r){
      if(r.error){ errMsg = r.error.message; phase = "signin"; } else { phase = "linksent"; } render(); });
    return; }
  if(f.dataset.form==="add"){ var maxSort = Object.keys(rows).reduce(function(mx,k){ var r = rows[k]; return r.kind==="task" && r.sort > mx ? r.sort : mx; }, 0);
    var t = {id:"t" + Date.now().toString(36), title:String(fd.get("title")).trim(), ws:fd.get("ws"), win:fd.get("win"), due:fd.get("due") || null, owner:me()==="You" ? "Vinz" : me(), status:"To do", q:"", notes:""};
    write([R("task", t.id, t, maxSort + 1)], [], "Added: " + t.title); }
  else if(f.dataset.form==="edit"){ var t2 = copy(findTask(f.dataset.id)); t2.title = String(fd.get("title")).trim(); t2.owner = String(fd.get("owner")).trim(); t2.due = fd.get("due") || null; t2.win = fd.get("win"); t2.notes = String(fd.get("notes")).trim(); ui.editing = null; write([R("task", t2.id, t2)], [], "Edited: " + t2.title); }
});

/* ---------- start ---------- */
if(LIVE){
  render();
  sb.auth.onAuthStateChange(function(ev, s){ session = s; setTimeout(afterAuth, 0); });
} else { loadLocal(); render(); }
})();
</script>
</body>
</html>
