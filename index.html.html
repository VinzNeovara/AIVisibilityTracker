<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Neovara AI Visibility Programme</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style id="css">:root{--navy:#1F2144;--navy9:#161832;--navy7:#2C2F5C;--beige:#F5F1EB;--beige1:#EDE7DB;--beige2:#E2D9C8;--blue:#DDE7F2;--blue6:#5F7FA3;--coral:#E86F51;--coral6:#C9553B;--coral1:#FBE3DB;--grey:#A4AAB3;--grey7:#6C7078;--green:#3F7D5C;
--bg:var(--beige);--card:#fff;--ink:var(--navy);--muted:var(--grey7);--line:var(--beige2);--soft:#FAF8F4;--chip:var(--blue);--hero:var(--navy);--heroink:var(--beige);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121427;--card:#1B1D3A;--ink:#F5F1EB;--muted:#A4AAB3;--line:#2C2F5C;--soft:#1F2144;--chip:#2C2F5C;--hero:#0E0F20;--heroink:#F5F1EB;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121427;--card:#1B1D3A;--ink:#F5F1EB;--muted:#A4AAB3;--line:#2C2F5C;--soft:#1F2144;--chip:#2C2F5C;--hero:#0E0F20;--heroink:#F5F1EB;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
/* hero */
.hero{background:var(--hero);color:var(--heroink);padding:22px 0 30px;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:90px;height:320px;background:var(--navy7);transform:skewX(-24deg);opacity:.55;pointer-events:none}
.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:26px;width:auto}
.clock{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.clock b{font-weight:600;font-size:15px}.clock span{font-weight:300;font-size:12px;opacity:.75}
.hero h1{font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.1;letter-spacing:-.01em;margin:28px 0 6px}
.sub{margin:0 0 22px;font-weight:300;max-width:62ch;opacity:.85}
.track{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:760px}
.seg .lean{height:14px;background:rgba(245,241,235,.14);transform:skewX(-24deg);overflow:hidden}
.seg .lean i{display:block;height:100%;background:var(--beige);transition:width .3s}
.segl{display:flex;justify-content:space-between;font-size:12px;font-weight:300;margin-top:6px;opacity:.85}
.today{position:absolute;top:-6px;width:3px;height:26px;background:var(--coral);transform:skewX(-24deg)}
/* tabs */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:0 max(24px,calc((100% - 1180px)/2 + 24px));padding-top:env(safe-area-inset-top,0px)}
.tab{font:inherit;font-size:14px;font-weight:500;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px 11px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
main.wrap{padding-top:24px;padding-bottom:16px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
.card h2{font-size:17px;font-weight:600;margin:0 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.card h2 small{font-size:12.5px;font-weight:300;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.cols>.card,.cols>div>.card{margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stats.two{grid-template-columns:1fr 1fr;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card .stat{background:var(--soft)}
.sv{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.sl{font-size:13px;font-weight:500;margin-top:4px}.sn{font-size:12px;font-weight:300;color:var(--muted)}
.empty{color:var(--muted);font-weight:300;margin:0}
.hint{font-size:12.5px;color:var(--muted);font-weight:300;margin:12px 0 0}
/* tasks */
.tasks{list-style:none;margin:0;padding:0}
.task,.mile{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.tasks>li:first-child{border-top:0}
.chk input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--navy);cursor:pointer}
@media (prefers-color-scheme:dark){.chk input{accent-color:var(--beige)}.bart{background:var(--navy7)}}
.tmain{flex:1;min-width:0}
.ttitle{font-weight:500;font-size:14.5px}
.task.done .ttitle{text-decoration:line-through;color:var(--muted);font-weight:400}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);font-weight:300;margin-top:3px}
.chip{background:var(--chip);color:var(--ink);border-radius:4px;padding:0 7px;font-weight:400}
.task.late .ttitle{color:var(--ink)}.latecopy{color:var(--coral6);font-weight:600}
@media (prefers-color-scheme:dark){.latecopy{color:var(--coral)}}
.note{font-size:13px;color:var(--muted);margin-top:4px}
.tside{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
select,input{font:inherit;font-size:13.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 8px;max-width:100%}
input[type=search],.url{width:100%}
.st{font-weight:500}.st-Done,.qs-Published{color:var(--green)}.st-Blocked{color:var(--coral6)}
.link{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 0}
.link:hover{color:var(--ink)}.danger:hover{color:var(--coral6)}
.btn{font:inherit;font-size:13.5px;font-weight:500;background:var(--navy);color:var(--beige);border:0;border-radius:4px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--navy7)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){.btn{background:var(--beige);color:var(--navy)}.btn:hover{background:var(--beige2)}}
.editrow{list-style:none;background:var(--soft);border-radius:10px;padding:14px;margin:4px 0 10px}
.editrow form,.editrow label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.editrow form{gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row{display:flex;gap:14px;align-items:center}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.5fr);gap:12px}
.filters label,.inline{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.addform{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
/* bars */
.bar{margin-bottom:12px}.barl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.barl span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.bart{height:8px;background:var(--beige1);border-radius:4px;overflow:hidden}.bart i{display:block;height:100%;background:var(--blue6)}
.plain{list-style:none;margin:0 0 8px;padding:0}.plain li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.plain li:first-child{border-top:0}.plain li span{color:var(--muted);font-weight:300;text-align:right}
.risks li{flex-direction:column;gap:2px}.risks li span{text-align:left}
/* gantt */
.gantt{position:relative;padding-top:24px;margin:0 8px 0 118px;min-width:560px}
.gscale span{position:absolute;top:0;font-size:12px;color:var(--muted);transform:translateX(2px)}
.gscale span::before{content:"";position:absolute;left:-2px;top:18px;height:150px;border-left:1px dashed var(--line);z-index:0}

.lane{position:relative;height:34px;margin-bottom:6px}
.lane.thin{height:24px;border-top:1px solid var(--line)}.lane.thin::before{content:"";position:absolute;left:-118px;right:0;top:-1px;border-top:1px solid var(--line)}
.lane em{position:absolute;left:-118px;width:110px;top:4px;font-style:normal;font-size:11.5px;color:var(--muted)}
.wbar{position:absolute;top:0;height:100%;background:var(--navy);color:var(--beige);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);display:flex;align-items:center;padding:0 18px;font-size:13px;font-weight:500;z-index:1}
@media (prefers-color-scheme:dark){.wbar{background:var(--blue6);color:#fff}}
.dot{position:absolute;top:9px;width:9px;height:9px;border-radius:50%;margin-left:-4px;z-index:1}
.dot.due{background:var(--navy7);opacity:.75}.dot.due.ok{background:var(--green)}
@media (prefers-color-scheme:dark){.dot.due{background:var(--beige)}}
.dot.blog{background:var(--blue6)}.dot.track{background:transparent;border:2px solid var(--blue6)}
.gtoday{position:absolute;top:18px;bottom:0;width:2px;background:var(--coral);z-index:2}
.gtoday span{position:absolute;top:-2px;left:5px;font-size:11px;font-weight:600;color:var(--coral6);background:var(--card);padding:0 3px}
.week{padding:12px 0;border-top:1px solid var(--line)}.week:first-child{border-top:0;padding-top:0}
.wk{display:flex;gap:10px;align-items:baseline;font-size:13px;margin-bottom:2px}.wk span{font-size:12px;color:var(--coral6);font-weight:600}
.week.past{opacity:.6}
.mile .mk{width:18px;flex:none;display:flex;justify-content:center;padding-top:6px}
.mile .mk::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue6)}
.mile.track .mk::before{background:transparent;border:2px solid var(--blue6)}
.mile.decision .mk::before{border-radius:2px;background:var(--navy);transform:rotate(45deg)}
@media (prefers-color-scheme:dark){.mile.decision .mk::before{background:var(--beige)}}
.mile.done .ttitle{text-decoration:line-through;color:var(--muted)}
/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.num{font-variant-numeric:tabular-nums;color:var(--muted);width:28px}
.qt .qq{font-weight:500;margin-bottom:2px}.qt .url{margin-top:8px;font-size:12.5px}
.qt td:nth-child(1){width:28px}.qt td:nth-child(2){min-width:320px}
.stage-Awareness{background:#EEF3F9}.stage-Consideration{background:var(--blue)}.stage-Evaluation{background:var(--beige1)}.stage-Decision{background:var(--beige2)}
@media (prefers-color-scheme:dark){.stage-Awareness,.stage-Consideration,.stage-Evaluation,.stage-Decision{background:var(--chip)}}
.pips{display:flex;gap:4px}.pip{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:transparent}
.pip.n{background:var(--soft);border-color:var(--grey)}.pip.y{background:var(--green);border-color:var(--green)}
.grid td{padding:6px}.grid .qq{min-width:240px;font-size:13px}
.cell{font:inherit;font-size:12.5px;width:100%;min-width:76px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--muted);padding:6px 4px;cursor:pointer}
.cell.c-Y{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.cell.c-N{background:var(--soft);color:var(--ink)}
.vchart{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:190px}
.vcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.vcol b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}.vcol b span{font-weight:300;color:var(--muted);font-size:12px}
.vbars{position:relative;flex:1;width:100%;max-width:44px;border-bottom:1px solid var(--line)}
.vbars i{position:absolute;bottom:0;left:0;right:0}
.vbars .tgt{border:1.5px dashed var(--blue6);border-bottom:0;background:transparent}
.vbars .act{left:7px;right:7px;background:var(--navy)}.vbars .act.hit{background:var(--green)}
@media (prefers-color-scheme:dark){.vbars .act{background:var(--beige)}}
.key{display:inline-block;width:10px;height:10px;margin:0 6px 0 12px;vertical-align:-1px}.key.tgt{border:1.5px dashed var(--blue6)}.key.act{background:var(--navy)}.key.tgt:first-child{margin-left:0}
.decs{list-style:none;margin:0;padding:0}.decs li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}.decs li:first-child{border-top:0}
.dn{font-weight:700;font-size:18px;width:22px}.decs li.done .ttitle{color:var(--muted);text-decoration:line-through}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-top:8px;padding-bottom:32px}
.savestate.s-saved{color:var(--green)}.savestate.s-error,.savestate.s-readonly{color:var(--coral6)}
body.ro .tside select,body.ro .chk input{cursor:not-allowed}
@media (max-width:900px){.cols{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.addform{grid-template-columns:1fr 1fr}.addform input[name=title]{grid-column:1/-1}}
@media (max-width:560px){.wrap{padding:0 16px}.grid3{grid-template-columns:1fr}.track{grid-template-columns:1fr}.today{display:none}.task{flex-wrap:wrap}.tside{flex-direction:row;width:100%;padding-left:30px;align-items:center}.card{padding:16px}}

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function d(s){ return new Date(s + "T00:00:00"); }
function today(){ var t = new Date(); t.setHours(0,0,0,0); return t; }
function fmt(s){ if(!s) return "No date"; return d(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }
function daysBetween(a,b){ return Math.round((b - a)/86400000); }
function winOf(id){ for(var i=0;i<WINDOWS.length;i++) if(WINDOWS[i].id===id) return WINDOWS[i]; }
function isOverdue(t){ return t.status!=="Done" && t.due && d(t.due) < today(); }

/* ---------- saving ---------- */
function buildDoc(){
  var css = document.getElementById("css").textContent;
  var js = document.getElementById("app").textContent;
  var json = JSON.stringify(STATE).replace(/</g,"\\u003c");
  var S = "<"+"script", E = "<"+"/script>";
  return "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">" +
    "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">" +
    "<title>Neovara AI Visibility Programme</title>" +
    "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>" +
    "<link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap\" rel=\"stylesheet\">" +
    "<style id=\"css\">" + css + "</style></head><body><div id=\"root\"></div>" +
    "<i id=\"logo-alt\" hidden data-src=\"" + LOGO_ALT + "\"></i><i id=\"logo-main\" hidden data-src=\"" + LOGO_MAIN + "\"></i>" +
    S + " type=\"application/json\" id=\"state\">" + json + E +
    S + " id=\"app\">" + js + E + "</body></html>";
}
function commit(note){
  if(readOnly) return;
  STATE.updated = new Date().toISOString();
  if(note){ STATE.log.unshift({at:STATE.updated, what:note}); STATE.log = STATE.log.slice(0,40); }
  render();
  setSave("pending");
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 1800);
}
function save(retried){
  if(!artReady){ setSave("waiting"); saveTimer = setTimeout(save, 1500); return; }
  if(!artNs){ setSave("unavailable"); return; }
  saveUi(); setSave("saving");
  artNs.publish(buildDoc()).then(function(){ setSave("saved"); }, function(e){
    var c = e && e.code;
    if(c==="conflict"){ setSave("conflict"); }
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed"){ readOnly = true; setSave("readonly"); render(); }
    else if(c==="rate_limited"){ setSave("pending"); saveTimer = setTimeout(save, 8000); }
    else if(!retried){ setTimeout(function(){ save(true); }, 1500 + Math.random()*1500); }
    else { setSave("error"); }
  });
}
var SAVE_COPY = {idle:"All changes saved", pending:"Saving shortly…", waiting:"Connecting…", saving:"Saving…", saved:"Saved for everyone",
  conflict:"Someone saved first. Loading their version.", readonly:"View only. You can't edit this tracker.",
  unavailable:"Saving isn't available in this view. Changes last until you close the page.", error:"Couldn't save. Try your change again."};
var saveState = "idle";
function setSave(s){ saveState = s; var el = document.getElementById("savestate"); if(el){ el.textContent = SAVE_COPY[s]; el.className = "savestate s-" + s; } }

/* ---------- metrics ---------- */
function namedCount(m){
  var r = STATE.results[m] || {}, n = 0;
  for(var q in r){ for(var a in r[q]){ if(r[q][a]==="Y"){ n++; break; } } }
  return n;
}
function runsFilled(m){ var r = STATE.results[m] || {}, n = 0; for(var q in r) for(var a in r[q]) if(r[q][a]) n++; return n; }
function latestMonth(){ for(var i=MONTHS.length-1;i>=0;i--) if(runsFilled(MONTHS[i])>0) return MONTHS[i]; return null; }
function progress(list){ var done = list.filter(function(t){return t.status==="Done";}).length; return {done:done,total:list.length,pct:list.length?Math.round(done*100/list.length):0}; }

/* ---------- render ---------- */
var TABS = [["overview","Overview"],["schedule","Schedule"],["todos","To-dos"],["queries","Queries"],["visibility","AI visibility"],["decisions","Decisions"]];
function render(){
  var tab = ui.tab || "overview";
  var root = document.getElementById("root");
  var body = {overview:vOverview,schedule:vSchedule,todos:vTodos,queries:vQueries,visibility:vVisibility,decisions:vDecisions}[tab]();
  root.innerHTML = vHeader() +
    "<nav class=\"tabs\" role=\"tablist\">" + TABS.map(function(t){ return "<button role=\"tab\" class=\"tab" + (t[0]===tab?" on":"") + "\" aria-selected=\"" + (t[0]===tab) + "\" data-tab=\"" + t[0] + "\">" + t[1] + "</button>"; }).join("") + "</nav>" +
    "<main class=\"wrap\">" + body + "</main>" +
    "<footer class=\"wrap foot\"><span id=\"savestate\" class=\"savestate s-" + saveState + "\">" + SAVE_COPY[saveState] + "</span>" +
    "<span>Last change " + (STATE.updated ? new Date(STATE.updated).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "—") + "</span></footer>";
  document.body.classList.toggle("ro", readOnly);
  if(readOnly) root.querySelectorAll("input,select,textarea,button.act").forEach(function(el){ el.disabled = true; });
}

function vHeader(){
  var t = today(), day = daysBetween(START, t) + 1, all = progress(STATE.tasks);
  var clock;
  if(day < 1) clock = "<b>Starts in " + (1-day) + " day" + (1-day===1?"":"s") + "</b><span>Day 1 is Monday 12 October</span>";
  else if(day <= 90) clock = "<b>Day " + day + " of 90</b><span>" + (90-day) + " days to the 9 January review</span>";
  else clock = "<b>Build window complete</b><span>Now in ongoing tracking</span>";
  var pos = Math.max(0, Math.min(100, (day-1)/90*100));
  var segs = WINDOWS.slice(0,3).map(function(w){
    var ts = STATE.tasks.filter(function(x){return x.win===w.id;}), p = progress(ts);
    return "<div class=\"seg\"><div class=\"lean\"><i style=\"width:" + p.pct + "%\"></i></div><div class=\"segl\"><span>" + w.name + "</span><span>" + p.done + "/" + p.total + " done</span></div></div>";
  }).join("");
  return "<header class=\"hero\"><div class=\"wrap\">" +
    "<div class=\"topline\"><img src=\"" + LOGO_ALT + "\" alt=\"Neovara\" class=\"logo\"><span class=\"clock\">" + clock + "</span></div>" +
    "<h1>AI visibility programme</h1><p class=\"sub\">Make Neovara the answer AI assistants give for F&amp;B and hospitality AI in the UAE. " + all.done + " of " + all.total + " to-dos done.</p>" +
    "<div class=\"track\">" + segs + "<div class=\"today\" style=\"left:" + pos + "%\" title=\"Today\"></div></div>" +
    "</div></header>";
}

function taskRow(t, compact){
  var w = winOf(t.win), od = isOverdue(t);
  return "<li class=\"task" + (t.status==="Done"?" done":"") + (od?" late":"") + "\" data-key=\"" + t.id + "\">" +
    "<label class=\"chk\"><input type=\"checkbox\" data-act=\"toggle\" data-id=\"" + t.id + "\"" + (t.status==="Done"?" checked":"") + "><span class=\"sr\">Mark done</span></label>" +
    "<div class=\"tmain\"><div class=\"ttitle\">" + esc(t.title) + "</div>" +
    "<div class=\"meta\"><span class=\"chip\">" + esc(t.ws) + "</span><span>" + (od?"<b class=\"latecopy\">Overdue · </b>":"") + (t.due ? "Due " + fmt(t.due) : "Ongoing") + "</span><span>" + esc(t.owner||"Unassigned") + "</span>" + (t.q?"<span>" + (t.q==="All"?"All queries":"Queries " + esc(t.q)) + "</span>":"") + (compact?"":"<span>" + w.name + "</span>") + "</div>" +
    (t.notes && !compact ? "<div class=\"note\">" + esc(t.notes) + "</div>" : "") + "</div>" +
    (compact ? "" : "<div class=\"tside\"><select data-act=\"status\" data-id=\"" + t.id + "\" aria-label=\"Status\" class=\"st st-" + t.status.replace(/\s/g,"") + "\">" + STATUSES.map(function(s){return "<option" + (s===t.status?" selected":"") + ">" + s + "</option>";}).join("") + "</select>" +
      "<button class=\"link act\" data-act=\"edit\" data-id=\"" + t.id + "\">Edit</button></div>") +
    "</li>" + (!compact && ui.editing===t.id ? editForm(t) : "");
}
function editForm(t){
  return "<li class=\"editrow\"><form data-form=\"edit\" data-id=\"" + t.id + "\">" +
    "<label>To-do<input name=\"title\" value=\"" + esc(t.title) + "\" required></label>" +
    "<div class=\"grid3\"><label>Owner<input name=\"owner\" list=\"owners\" value=\"" + esc(t.owner) + "\"></label>" +
    "<label>Due date<input type=\"date\" name=\"due\" value=\"" + esc(t.due||"") + "\"></label>" +
    "<label>Window<select name=\"win\">" + WINDOWS.map(function(w){return "<option value=\"" + w.id + "\"" + (w.id===t.win?" selected":"") + ">" + w.name + "</option>";}).join("") + "</select></label></div>" +
    "<label>Notes<input name=\"notes\" value=\"" + esc(t.notes||"") + "\" placeholder=\"Links, blockers, who to chase\"></label>" +
    "<div class=\"row\"><button class=\"btn act\" type=\"submit\">Save to-do</button><button class=\"link act\" type=\"button\" data-act=\"cancel\">Cancel</button><button class=\"link danger act\" type=\"button\" data-act=\"delete\" data-id=\"" + t.id + "\">Delete to-do</button></div>" +
    "<datalist id=\"owners\"><option>Vinz</option><option>Greg</option></datalist></form></li>";
}

function vOverview(){
  var t = today(), soon = new Date(t); soon.setDate(soon.getDate()+14);
  var open = STATE.tasks.filter(function(x){return x.status!=="Done";});
  var late = open.filter(isOverdue);
  var due = open.filter(function(x){ return x.due && d(x.due) >= t && d(x.due) <= soon; }).sort(function(a,b){return a.due<b.due?-1:1;});
  var blocked = open.filter(function(x){return x.status==="Blocked";});
  var pend = STATE.decisions.filter(function(x){return x.status!=="Approved";});
  var lm = latestMonth(), named = lm ? namedCount(lm) : null, tgt = lm ? STATE.targets[lm] : null;
  var pub = STATE.queries.filter(function(q){return q.status==="Published"||q.status==="Refreshing";}).length;
  var stats = "<div class=\"stats\">" +
    stat(late.length, "Overdue to-dos", late.length ? "Clear these first" : "Nothing overdue") +
    stat(due.length, "Due in the next 14 days", "") +
    stat(pub + "/15", "Query pages live", "") +
    stat(named==null ? "—" : named + "/15", "Queries where AI names Neovara", named==null ? "No visibility check logged yet" : MONTH_LABEL[lm] + (tgt!=null ? " · target " + tgt : "")) + "</div>";
  function list(title, arr, empty){ return "<section class=\"card\"><h2>" + title + "</h2>" + (arr.length ? "<ul class=\"tasks\">" + arr.map(function(x){return taskRow(x,true);}).join("") + "</ul>" : "<p class=\"empty\">" + empty + "</p>") + "</section>"; }
  var wsBars = WORKSTREAMS.map(function(w){ var p = progress(STATE.tasks.filter(function(x){return x.ws===w;})); if(!p.total) return ""; return "<div class=\"bar\"><div class=\"barl\"><span>" + w + "</span><span>" + p.done + "/" + p.total + "</span></div><div class=\"bart\"><i style=\"width:" + p.pct + "%\"></i></div></div>"; }).join("");
  var decis = "<section class=\"card\"><h2>Waiting on Greg</h2>" + (pend.length ? "<ul class=\"plain\">" + pend.map(function(x){ return "<li><b>" + esc(x.title) + "</b><span>" + esc(x.due) + "</span></li>"; }).join("") + "</ul><button class=\"link\" data-tab=\"decisions\">Open decisions</button>" : "<p class=\"empty\">All five decisions approved.</p>") + "</section>";
  return stats + "<div class=\"cols\"><div>" +
    (late.length ? list("Overdue", late, "") : "") +
    list("Due in the next 14 days", due, "Nothing due in the next two weeks. Check the schedule for what's coming.") +
    (blocked.length ? list("Blocked", blocked, "") : "") +
    "</div><div>" + decis + "<section class=\"card\"><h2>Progress by workstream</h2>" + wsBars + "</section>" +
    "<section class=\"card\"><h2>Recent activity</h2>" + (STATE.log.length ? "<ul class=\"plain log\">" + STATE.log.slice(0,6).map(function(l){ return "<li><span>" + esc(l.what) + "</span><span>" + new Date(l.at).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) + "</span></li>"; }).join("") + "</ul>" : "<p class=\"empty\">No changes yet. Tick off a to-do and it shows here.</p>") + "</section>" +
    "</div></div>";
}
function stat(v,l,n){ return "<div class=\"stat\"><div class=\"sv\">" + v + "</div><div class=\"sl\">" + l + "</div>" + (n?"<div class=\"sn\">" + esc(n) + "</div>":"") + "</div>"; }

function vSchedule(){
  var span = daysBetween(START, END);
  function x(s){ return Math.max(0,Math.min(100, daysBetween(START, d(s))/span*100)); }
  var t = today(), tpos = Math.max(0,Math.min(100, daysBetween(START,t)/span*100));
  var months = [["2026-10-12","Oct"],["2026-11-01","Nov"],["2026-12-01","Dec"],["2027-01-01","Jan"]];
  var dated = STATE.tasks.filter(function(x){return x.due;});
  var lanes = WINDOWS.slice(0,3).map(function(w){
    return "<div class=\"lane\"><div class=\"wbar\" style=\"left:" + x(w.from) + "%;width:" + (x(w.to)-x(w.from)) + "%\"><span>" + w.name + "</span></div></div>";
  }).join("");
  var dots = function(k){ return MILESTONES.filter(function(m){return m.k===k;}).map(function(m){ return "<i class=\"dot " + k + "\" style=\"left:" + x(m.d) + "%\" title=\"" + esc(m.t + ", " + fmt(m.d)) + "\"></i>"; }).join(""); };
  var dues = dated.map(function(tk){ return "<i class=\"dot due" + (tk.status==="Done"?" ok":"") + "\" style=\"left:" + x(tk.due) + "%\" title=\"" + esc(tk.title + " · " + fmt(tk.due)) + "\"></i>"; }).join("");
  var gantt = "<section class=\"card\"><h2>90-day timeline<small>" + (t < START ? "Starts Monday 12 October" : t > END ? "Build window complete" : "Today is day " + (daysBetween(START,t)+1)) + "</small></h2><div class=\"scroll\"><div class=\"gantt\">" +
    "<div class=\"gscale\">" + months.map(function(m){return "<span style=\"left:" + x(m[0]) + "%\">" + m[1] + "</span>";}).join("") + "</div>" +
    lanes + "<div class=\"lane thin\"><em>Due dates</em>" + dues + "</div><div class=\"lane thin\"><em>Blog slots</em>" + dots("blog") + "</div><div class=\"lane thin\"><em>Visibility checks</em>" + dots("track") + "</div>" +
    (t >= START && t <= END ? "<div class=\"gtoday\" style=\"left:" + tpos + "%\"><span>Today</span></div>" : "") + "</div>" +
    "</div><p class=\"hint\">Hover a dot for the item and date. Blog slots follow the 1st and 3rd Wednesday cadence.</p></section>";
  // week-by-week agenda
  var items = dated.map(function(tk){return {date:tk.due,kind:"task",task:tk};})
    .concat(MILESTONES.map(function(m){return {date:m.d,kind:m.k,title:m.t};}))
    .concat(STATE.decisions.filter(function(x){return x.date;}).map(function(x){return {date:x.date,kind:"decision",title:"Decision: " + x.title, done:x.status==="Approved"};}))
    .sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
  var weeks = {}, order = [];
  items.forEach(function(it){ var dt = d(it.date), mon = new Date(dt); mon.setDate(dt.getDate() - ((dt.getDay()+6)%7)); var k = mon.toISOString().slice(0,10); if(!weeks[k]){weeks[k]=[];order.push(k);} weeks[k].push(it); });
  var thisMon = new Date(t); thisMon.setDate(t.getDate() - ((t.getDay()+6)%7));
  var agenda = order.map(function(k){
    var mon = d(k), sun = new Date(mon); sun.setDate(mon.getDate()+6);
    var cur = mon.getTime()===thisMon.getTime(), past = sun < t;
    return "<div class=\"week" + (cur?" cur":"") + (past?" past":"") + "\"><div class=\"wk\"><b>" + mon.toLocaleDateString("en-GB",{day:"numeric",month:"short"}) + " – " + sun.toLocaleDateString("en-GB",{day:"numeric",month:"short"}) + "</b>" + (cur?"<span>This week</span>":"") + "</div><ul class=\"tasks\">" +
      weeks[k].map(function(it){
        if(it.kind==="task") return taskRow(it.task, true);
        return "<li class=\"mile " + it.kind + (it.done?" done":"") + "\"><span class=\"mk\"></span><div class=\"tmain\"><div class=\"ttitle\">" + esc(it.title) + "</div><div class=\"meta\"><span>" + d(it.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}) + "</span></div></div></li>";
      }).join("") + "</ul></div>";
  }).join("");
  var ongoing = STATE.tasks.filter(function(x){return !x.due;});
  return gantt + "<div class=\"cols\"><section class=\"card\"><h2>Week by week</h2>" + agenda + "</section>" +
    "<section class=\"card\"><h2>Ongoing, no fixed date</h2><ul class=\"tasks\">" + ongoing.map(function(x){return taskRow(x,true);}).join("") + "</ul></section></div>";
}

function vTodos(){
  var f = ui.f || {};
  var list = STATE.tasks.filter(function(t){
    return (!f.win || t.win===f.win) && (!f.ws || t.ws===f.ws) && (!f.st || (f.st==="open" ? t.status!=="Done" : t.status===f.st)) && (!f.q || (t.title+" "+t.owner+" "+(t.notes||"")).toLowerCase().indexOf(f.q.toLowerCase())>=0);
  });
  var groups = WINDOWS.map(function(w){
    var ts = list.filter(function(t){return t.win===w.id;}).sort(function(a,b){ return (a.due||"9")<(b.due||"9")?-1:1; });
    if(!ts.length) return "";
    var p = progress(STATE.tasks.filter(function(t){return t.win===w.id;}));
    return "<section class=\"card\"><h2>" + w.name + "<small>" + (w.to ? fmt(w.from) + " – " + fmt(w.to) : "From " + fmt(w.from)) + " · " + p.done + "/" + p.total + " done</small></h2><ul class=\"tasks\">" + ts.map(function(t){return taskRow(t,false);}).join("") + "</ul></section>";
  }).join("");
  function sel(name, opts, label){ return "<label>" + label + "<select data-filter=\"" + name + "\"><option value=\"\">All</option>" + opts.map(function(o){ var v = Array.isArray(o)?o[0]:o, l = Array.isArray(o)?o[1]:o; return "<option value=\"" + esc(v) + "\"" + (f[name]===v?" selected":"") + ">" + esc(l) + "</option>"; }).join("") + "</select></label>"; }
  return "<section class=\"card filters\">" +
    sel("win", WINDOWS.map(function(w){return [w.id,w.name];}), "Window") + sel("ws", WORKSTREAMS, "Workstream") +
    sel("st", [["open","Not done"]].concat(STATUSES), "Status") +
    "<label>Search<input type=\"search\" data-filter=\"q\" value=\"" + esc(f.q||"") + "\" placeholder=\"Title, owner, notes\"></label></section>" +
    "<section class=\"card\"><h2>Add a to-do</h2><form data-form=\"add\" class=\"addform\"><input name=\"title\" placeholder=\"What needs doing?\" required aria-label=\"To-do\">" +
    "<select name=\"ws\" aria-label=\"Workstream\">" + WORKSTREAMS.map(function(w){return "<option>" + w + "</option>";}).join("") + "</select>" +
    "<select name=\"win\" aria-label=\"Window\">" + WINDOWS.map(function(w){return "<option value=\"" + w.id + "\">" + w.name + "</option>";}).join("") + "</select>" +
    "<input type=\"date\" name=\"due\" aria-label=\"Due date\"><button class=\"btn act\" type=\"submit\">Add to-do</button></form></section>" +
    (groups || "<section class=\"card\"><p class=\"empty\">No to-dos match these filters. Clear a filter to see more.</p></section>");
}

function vQueries(){
  var rows = STATE.queries.map(function(q){
    var hist = MONTHS.map(function(m){ var r = (STATE.results[m]||{})[q.n] || {}; var any = ASSISTANTS.some(function(a){return r[a];}); var y = ASSISTANTS.filter(function(a){return r[a]==="Y";}).length; return "<i class=\"pip" + (y?" y":any?" n":"") + "\" title=\"" + MONTH_LABEL[m] + ": " + (any? y + " of 5 assistants" : "not checked") + "\"></i>"; }).join("");
    return "<tr><td class=\"num\">" + q.n + "</td><td><div class=\"qq\">" + esc(q.q) + "</div><div class=\"meta\"><span class=\"chip stage-" + q.stage + "\">" + q.stage + "</span><span>" + esc(q.build) + "</span></div>" +
      "<input class=\"url\" data-act=\"qurl\" data-n=\"" + q.n + "\" value=\"" + esc(q.url||"") + "\" placeholder=\"Page URL once live\" aria-label=\"Page URL for query " + q.n + "\"></td>" +
      "<td>" + winOf(q.wave).name + "<div class=\"meta\"><span>Due " + fmt(q.due) + "</span></div></td>" +
      "<td><select data-act=\"qstatus\" data-n=\"" + q.n + "\" aria-label=\"Page status\" class=\"st qs-" + q.status.replace(/\s/g,"") + "\">" + PAGE_STATUSES.map(function(s){return "<option" + (s===q.status?" selected":"") + ">" + s + "</option>";}).join("") + "</select></td>" +
      "<td><div class=\"pips\">" + hist + "</div></td></tr>";
  }).join("");
  return "<section class=\"card\"><h2>Top 15 queries<small>One page per query. Dots show each month's AI visibility, oldest first.</small></h2><div class=\"scroll\"><table class=\"qt\"><thead><tr><th>#</th><th>Query and what we build</th><th>Wave</th><th>Page status</th><th>Named by AI</th></tr></thead><tbody>" + rows + "</tbody></table></div></section>";
}

function vVisibility(){
  var m = ui.month || (latestMonth() || MONTHS[0]);
  var r = STATE.results[m] || {};
  var grid = STATE.queries.map(function(q){
    var row = r[q.n] || {};
    return "<tr><td class=\"num\">" + q.n + "</td><td class=\"qq\">" + esc(q.q) + "</td>" + ASSISTANTS.map(function(a){ var v = row[a]||""; return "<td><button class=\"cell act c-" + (v||"x") + "\" data-act=\"cell\" data-n=\"" + q.n + "\" data-a=\"" + a + "\" aria-label=\"" + esc(a + ", query " + q.n + ": " + (v==="Y"?"named":v==="N"?"not named":"not checked")) + "\">" + (v==="Y"?"Named":v==="N"?"No":"—") + "</button></td>"; }).join("") + "</tr>";
  }).join("");
  var max = 15, chart = MONTHS.slice(1).map(function(mm){
    var n = runsFilled(mm) ? namedCount(mm) : null, tg = STATE.targets[mm];
    return "<div class=\"vcol\"><div class=\"vbars\"><i class=\"tgt\" style=\"height:" + (tg/max*100) + "%\" title=\"Target " + tg + "\"></i>" + (n!=null?"<i class=\"act" + (n>=tg?" hit":"") + "\" style=\"height:" + (n/max*100) + "%\" title=\"Named " + n + "\"></i>":"") + "</div><b>" + (n==null?"—":n) + "<span>/" + tg + "</span></b><span>" + MONTH_LABEL[mm].replace(" 20"," ’") + "</span></div>";
  }).join("");
  var nm = namedCount(m), filled = runsFilled(m);
  return "<div class=\"cols\"><section class=\"card\"><h2>Named vs target<small>Queries where at least one assistant names Neovara</small></h2><div class=\"vchart\">" + chart + "</div><p class=\"hint\"><span class=\"key tgt\"></span>Target <span class=\"key act\"></span>Actual</p></section>" +
    "<section class=\"card\"><h2>" + MONTH_LABEL[m] + "</h2><div class=\"stats two\">" + stat(nm + "/15","Queries named","") + stat(filled + "/75","Checks logged","") + "</div>" +
    "<label class=\"inline\">Month<select data-act=\"month\">" + MONTHS.map(function(x){return "<option value=\"" + x + "\"" + (x===m?" selected":"") + ">" + MONTH_LABEL[x] + "</option>";}).join("") + "</select></label></section></div>" +
    "<section class=\"card\"><h2>Log this month's checks<small>Ask each query in each assistant. Click a cell to cycle: not checked → Named → No.</small></h2><div class=\"scroll\"><table class=\"grid\"><thead><tr><th>#</th><th>Query</th>" + ASSISTANTS.map(function(a){return "<th>" + a + "</th>";}).join("") + "</tr></thead><tbody>" + grid + "</tbody></table></div></section>";
}

function vDecisions(){
  return "<section class=\"card\"><h2>Decisions needed from Greg<small>These unblock the roadmap</small></h2><ul class=\"decs\">" + STATE.decisions.map(function(x,i){
    var ok = x.status==="Approved";
    return "<li class=\"" + (ok?"done":"") + "\"><span class=\"dn\">" + (i+1) + "</span><div class=\"tmain\"><div class=\"ttitle\">" + esc(x.title) + "</div><div class=\"note\">" + esc(x.why) + "</div><div class=\"meta\"><span>When: " + esc(x.due) + "</span>" + (ok && x.approvedAt?"<span>Approved " + new Date(x.approvedAt).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) + "</span>":"") + "</div></div>" +
      "<button class=\"btn act" + (ok?" ghost":"") + "\" data-act=\"decide\" data-id=\"" + x.id + "\">" + (ok?"Undo approval":"Mark approved") + "</button></li>";
  }).join("") + "</ul></section>" +
  "<section class=\"card\"><h2>Risks</h2><ul class=\"plain risks\">" +
  "<li><b>Broad queries stay out of reach</b><span>Large firms hold \"best AI company in UAE\". We win the niche first, then widen.</span></li>" +
  "<li><b>Results lag publishing</b><span>Assistants refresh on their own schedules. We track monthly and keep refreshing pages.</span></li>" +
  "<li><b>Baseline delayed</b><span>Without HubSpot AEO access, checks are logged by hand on the AI visibility tab.</span></li></ul></section>";
}

/* ---------- events ---------- */
function findTask(id){ return STATE.tasks.filter(function(t){return t.id===id;})[0]; }
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-tab],[data-act]"); if(!el) return;
  if(el.dataset.tab){ ui.tab = el.dataset.tab; ui.editing = null; saveUi(); render(); window.scrollTo(0,0); return; }
  var a = el.dataset.act;
  if(a==="edit"){ ui.editing = ui.editing===el.dataset.id ? null : el.dataset.id; render(); }
  else if(a==="cancel"){ ui.editing = null; render(); }
  else if(a==="delete"){ var t = findTask(el.dataset.id); if(t && confirm("Delete \"" + t.title + "\"?")){ STATE.tasks = STATE.tasks.filter(function(x){return x.id!==t.id;}); ui.editing = null; commit("Deleted: " + t.title); } }
  else if(a==="cell"){ var n = el.dataset.n, asn = el.dataset.a, m = ui.month || (latestMonth()||MONTHS[0]);
    STATE.results[m] = STATE.results[m] || {}; STATE.results[m][n] = STATE.results[m][n] || {};
    var v = STATE.results[m][n][asn] || ""; v = v==="" ? "Y" : v==="Y" ? "N" : ""; if(v) STATE.results[m][n][asn] = v; else delete STATE.results[m][n][asn];
    ui.month = m; saveUi(); commit(null); }
  else if(a==="decide"){ var x = STATE.decisions.filter(function(y){return y.id===el.dataset.id;})[0]; if(x.status==="Approved"){ x.status="Pending"; x.approvedAt=null; commit("Approval undone: " + x.title); } else { x.status="Approved"; x.approvedAt=new Date().toISOString(); commit("Approved: " + x.title); } }
});
document.addEventListener("change", function(e){
  var el = e.target;
  if(el.dataset.filter){ ui.f = ui.f || {}; ui.f[el.dataset.filter] = el.value; saveUi(); render(); return; }
  var a = el.dataset.act;
  if(a==="toggle"){ var t = findTask(el.dataset.id); t.status = el.checked ? "Done" : "To do"; t.doneAt = el.checked ? new Date().toISOString() : null; commit((el.checked?"Done: ":"Reopened: ") + t.title); }
  else if(a==="status"){ var t2 = findTask(el.dataset.id); t2.status = el.value; commit(t2.title + " → " + el.value); }
  else if(a==="qstatus"){ var q = STATE.queries[+el.dataset.n-1]; q.status = el.value; commit("Query " + q.n + " page → " + el.value); }
  else if(a==="qurl"){ var q2 = STATE.queries[+el.dataset.n-1]; q2.url = el.value.trim(); commit(null); }
  else if(a==="month"){ ui.month = el.value; saveUi(); render(); }
});
document.addEventListener("input", function(e){
  if(e.target.dataset.filter==="q"){ ui.f = ui.f||{}; ui.f.q = e.target.value; saveUi(); clearTimeout(window.__qt); window.__qt = setTimeout(function(){ var pos = e.target.selectionStart; render(); var s = document.querySelector("[data-filter=q]"); if(s){ s.focus(); try{ s.setSelectionRange(pos,pos); }catch(_){} } }, 250); }
});
document.addEventListener("submit", function(e){
  e.preventDefault(); var f = e.target, fd = new FormData(f);
  if(f.dataset.form==="add"){ var id = "t" + Date.now().toString(36); STATE.tasks.push({id:id,title:fd.get("title").trim(),ws:fd.get("ws"),win:fd.get("win"),due:fd.get("due")||null,owner:"Vinz",status:"To do",q:"",notes:""}); commit("Added: " + fd.get("title").trim()); }
  else if(f.dataset.form==="edit"){ var t = findTask(f.dataset.id); t.title = fd.get("title").trim(); t.owner = fd.get("owner").trim(); t.due = fd.get("due")||null; t.win = fd.get("win"); t.notes = fd.get("notes").trim(); ui.editing = null; commit("Edited: " + t.title); }
});

render();
if(window.claude && window.claude.use){ window.claude.use("artifact").then(function(ns){ artNs = ns; artReady = true; if(!ns) setSave(saveState==="idle"?"idle":"unavailable"); }, function(){ artReady = true; }); }
else { artReady = true; }
})();
</script></body></html>
